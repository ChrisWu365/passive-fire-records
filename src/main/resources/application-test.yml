# Always the in-memory database, whatever REGISTER_DB_* says: the tests empty the register tables.
spring:
  datasource:
    url: "jdbc:h2:mem:registerdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""

# Test-only signing secret; the security tests sign their tokens with the same value.
register:
  security:
    jwt-secret: "test-only-jwt-secret-0123456789-abcdefghij"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
