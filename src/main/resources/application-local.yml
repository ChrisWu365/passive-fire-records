# Always the in-memory database, whatever REGISTER_DB_* says.
spring:
  datasource:
    url: "jdbc:h2:mem:registerdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  h2:
    console:
      enabled: true

# Local development only. The inspection service falls back to the same value when JWT_SECRET is unset, so
# sign-in works across both services without any setup.
register:
  security:
    jwt-secret: "${JWT_SECRET:local-development-only-secret-do-not-deploy}"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
