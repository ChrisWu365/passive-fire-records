services:
  inspection-api:
    build:
      context: ../../apps/inspection-api
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the inspection demo}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL connection string the container can reach}
      REGISTER_SERVICE_URL: ${REGISTER_SERVICE_URL:-http://host.docker.internal:8080}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    # The register service is expected on the host, on port 8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - inspection-data:/app/data
    expose:
      - "4000"
    restart: unless-stopped

  inspection-web:
    build:
      context: ../../apps/inspection-web
    depends_on:
      - inspection-api
    # The web container's Nginx sends /api/register/ to "product-crud:8080", the register service's name in
    # Kubernetes. Here that name points at the host, where the register service runs.
    extra_hosts:
      - "product-crud:host-gateway"
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  inspection-data:
