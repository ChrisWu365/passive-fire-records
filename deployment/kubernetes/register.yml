apiVersion: apps/v1
kind: Deployment
metadata:
  name: register-api
  labels:
    app: register-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: register-api
  template:
    metadata:
      labels:
        app: register-api
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register-api
          image: register-api:replace-me
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: __SPRING_PROFILE__
            - name: REGISTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: register-secrets
                  key: database-url
            - name: REGISTER_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: register-secrets
                  key: database-username
            - name: REGISTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: register-secrets
                  key: database-password
            # The same secret the inspection API signs tokens with; the register service verifies them.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: register-api
  labels:
    app: register-api
spec:
  # Reached only from inside the cluster: by the web app's Nginx, the inspection API and Prometheus.
  type: ClusterIP
  selector:
    app: register-api
  ports:
    - name: http
      port: 8080
      targetPort: http
