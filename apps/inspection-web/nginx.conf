server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10M;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The register service (Java). Nginx picks the longest matching prefix, so these requests never reach
  # the general /api/ rule below. No path follows the host, so the path is passed on unchanged.
  location /api/register/ {
    proxy_pass http://product-crud:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Everything else under /api/ belongs to the inspection service (Node.js).
  location /api/ {
    proxy_pass http://inspection-api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://inspection-api:4000;
  }

  location /uploads/ {
    proxy_pass http://inspection-api:4000;
  }
}
