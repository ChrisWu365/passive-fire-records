# The tests run against a real PostgreSQL, the same engine as every deployed environment. The "jdbc:tc:" URL
# makes Testcontainers start a throwaway PostgreSQL container in Docker on the first connection and remove it
# when the test run ends, so REGISTER_DATABASE_* is never read and no existing database is touched.
spring:
  datasource:
    url: "jdbc:tc:postgresql:17-alpine:///register_test"
    username: test
    password: test

# Test-only signing secret; the security tests sign their tokens with the same value.
register:
  security:
    jwt-secret: "test-only-jwt-secret-0123456789-abcdefghij"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
