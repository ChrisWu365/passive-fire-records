name: Reusable - CI Inspection

# Reusable workflow: builds and tests the TypeScript inspection API and web app,
# then runs the Playwright suite. Playwright starts the register service and both
# dev servers itself (see e2e/playwright.config.ts), so no external wait-on
# step is needed.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-test:
    name: Build and unit test (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: inspection-api
            test-command: npm test
          - app: inspection-web
            test-command: npm run test:coverage
    # The inspection API's store and migration tests run against a real PostgreSQL. Each test run creates
    # and drops its own schema, so nothing persists between runs.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
      - name: Run unit tests
        working-directory: apps/${{ matrix.app }}
        run: ${{ matrix.test-command }}
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.app }}-coverage
          path: apps/${{ matrix.app }}/coverage/
          if-no-files-found: ignore
          retention-days: 7

  e2e-test:
    name: Playwright E2E
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The end-to-end run starts the register service (Java), the inspection service and the web app, with
    # nothing stubbed between them. Both services keep their data in this PostgreSQL, each in its own schema.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            apps/inspection-api/package-lock.json
            apps/inspection-web/package-lock.json
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/register-api/pom.xml
      - name: Install workspace dependencies
        run: |
          npm --prefix apps/inspection-api ci
          npm --prefix apps/inspection-web ci
          npm --prefix e2e ci
      - name: Compile the register service
        # Done ahead of the tests so that Playwright's start-up timeout is not spent downloading dependencies.
        run: mvn --batch-mode --no-transfer-progress -f apps/register-api/pom.xml -DskipTests compile
      # Browser downloads are cached by Playwright version; the system packages they need are not part of
      # that download, so they are installed either way.
      - name: Read the Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "${GITHUB_OUTPUT}"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps
      - name: Run E2E tests
        working-directory: e2e
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 30
